name: Bug
description: Something in the website or app is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Steps to reproduce, expected vs actual }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: Where, description: "URL / screen / device / browser" }
